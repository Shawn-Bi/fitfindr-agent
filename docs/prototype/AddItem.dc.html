<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add an item to your closet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0369A1}a:hover{color:#075985}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F8FC; color: #1B1E1C; font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden">
  <header style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid #DADDD7; background: #F2F8FC">
    <a href="Closet.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 10px; font-size: 15px; text-decoration: none; color: #1B1E1C">Cancel</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px">Add item</h1>
    <span style="width: 66px"></span>
  </header>

  <form style="height: 692px; overflow-y: auto; box-sizing: border-box; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; gap: 12px; align-items: stretch">
      <div role="img" aria-label="Your uploaded photo: dark-wash jeans" style="width: 128px; height: 160px; border-radius: 14px; background: #34507A; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center">
        <svg width="56" height="56" viewBox="0 0 64 64" fill="none" stroke="#8FA6C8" stroke-width="2" aria-hidden="true"><path d="M20 8h24l4 48H36l-4-30-4 30H16z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; justify-content: center">
        <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #1B1E1C; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1E1C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Retake</button>
        <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #C9CDC6; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1B1E1C">Remove photo</button>
        <div style="font-size: 12px; color: #4F5551; line-height: 1.4">JPG, PNG or HEIC, up to 10 MB. Location data is removed.</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nm" style="font-size: 14px; font-weight: 700">Name <span style="color: #0369A1">*</span></label>
      <input id="nm" type="text" value="Baggy straight-leg jeans, dark wash" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9CDC6; border-radius: 12px; padding: 0 14px; font-size: 15px; font-family: 'DM Sans', sans-serif; background: #FFFFFF">
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Category <span style="color: #0369A1">*</span></legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1B1E1C">Tops</button>
        <button type="button" aria-pressed="true" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #1B1E1C; background: #1B1E1C; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700">Bottoms</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1B1E1C">Outerwear</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1B1E1C">Dresses</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1B1E1C">Shoes</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #1B1E1C">Accessories</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Colors <span style="color: #0369A1">*</span></legend>
      <div style="display: flex; gap: 10px">
        <button type="button" aria-label="Dark blue, selected" style="width: 44px; height: 44px; border-radius: 999px; background: #34507A; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #0369A1"></button>
        <button type="button" aria-label="Indigo, selected" style="width: 44px; height: 44px; border-radius: 999px; background: #3B3F7A; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #0369A1"></button>
        <button type="button" aria-label="Black" style="width: 44px; height: 44px; border-radius: 999px; background: #1B1E1C; border: 0"></button>
        <button type="button" aria-label="White" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #C9CDC6"></button>
        <button type="button" aria-label="More colors" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px dashed #4F5551; font-size: 20px; color: #4F5551">+</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Style tags</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #0369A1; background: #DCEFFB; color: #075985; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700">denim</button>
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #0369A1; background: #DCEFFB; color: #075985; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700">streetwear</button>
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #0369A1; background: #DCEFFB; color: #075985; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700">baggy</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 13px">vintage</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 13px">+ add tag</button>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="sz" style="font-size: 14px; font-weight: 700">Size</label>
        <input id="sz" type="text" value="W30 L32" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9CDC6; border-radius: 12px; padding: 0 14px; font-size: 15px; font-family: 'DM Sans', sans-serif; background: #FFFFFF; min-width: 0">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="br" style="font-size: 14px; font-weight: 700">Brand</label>
        <input id="br" type="text" placeholder="Optional" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9CDC6; border-radius: 12px; padding: 0 14px; font-size: 15px; font-family: 'DM Sans', sans-serif; background: #FFFFFF; min-width: 0">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nt" style="font-size: 14px; font-weight: 700">Notes</label>
      <textarea id="nt" rows="2" style="box-sizing: border-box; border: 1.5px solid #C9CDC6; border-radius: 12px; padding: 12px 14px; font-size: 15px; font-family: 'DM Sans', sans-serif; background: #FFFFFF; resize: none">High-waisted, sits above the hip</textarea>
    </div>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; box-sizing: border-box; padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #DADDD7">
    <a href="ItemDetail.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #0369A1; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">Save to closet</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
