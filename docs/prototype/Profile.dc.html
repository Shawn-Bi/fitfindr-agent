<style>
body{margin:0}
a{color:#0369A1}a:hover{color:#075985}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F8FC; color: #1B1E1C; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 4px 20px">
    <div style="font-size: 13px; color: #4F5551; font-weight: 500">Step 2 of 2 · all optional</div>
    <a href="Closet.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 8px; font-weight: 700; font-size: 15px; text-decoration: none">Skip for now</a>
  </header>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; letter-spacing: -0.5px">Your sizes and style</h1>
    <p style="margin: 0; font-size: 14px; color: #4F5551">Used only to filter and rank finds for you. Edit any time in Profile.</p>
  </div>

  <form style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Usual sizes</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4F5551">Tops
          <select style="height: 46px; border: 1.5px solid #C9CDC6; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: 'DM Sans', sans-serif; color: #1B1E1C; padding: 0 8px"><option>M</option></select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4F5551">Bottoms
          <select style="height: 46px; border: 1.5px solid #C9CDC6; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: 'DM Sans', sans-serif; color: #1B1E1C; padding: 0 8px"><option>W30 L32</option></select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4F5551">Shoes (US)
          <select style="height: 46px; border: 1.5px solid #C9CDC6; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: 'DM Sans', sans-serif; color: #1B1E1C; padding: 0 8px"><option>8.5</option></select>
        </label>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Styles you like</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #1B1E1C; background: #1B1E1C; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700">Vintage</button>
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #1B1E1C; background: #1B1E1C; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700">Y2K</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 14px">Streetwear</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 14px">Minimalist</button>
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #1B1E1C; background: #1B1E1C; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700">Grunge</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 14px">Cottagecore</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 14px; font-weight: 700; padding: 0; margin-bottom: 8px">Colors you wear most</legend>
      <div style="display: flex; gap: 10px">
        <button type="button" aria-label="Black, selected" style="width: 44px; height: 44px; border-radius: 999px; background: #1B1E1C; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #0369A1"></button>
        <button type="button" aria-label="Denim blue, selected" style="width: 44px; height: 44px; border-radius: 999px; background: #34507A; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #0369A1"></button>
        <button type="button" aria-label="White" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #C9CDC6"></button>
        <button type="button" aria-label="Rust" style="width: 44px; height: 44px; border-radius: 999px; background: #A9502A; border: 0"></button>
        <button type="button" aria-label="Olive" style="width: 44px; height: 44px; border-radius: 999px; background: #6B7340; border: 0"></button>
        <button type="button" aria-label="Pink" style="width: 44px; height: 44px; border-radius: 999px; background: #E4A3B4; border: 0"></button>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="budget" style="font-size: 14px; font-weight: 700">Usual budget per item</label>
      <div style="display: flex; align-items: center; height: 48px; box-sizing: border-box; border: 1.5px solid #C9CDC6; border-radius: 12px; background: #FFFFFF; padding: 0 14px; gap: 6px">
        <span style="color: #4F5551">up to $</span>
        <input id="budget" type="number" value="40" style="flex: 1; border: 0; outline: none; font-size: 16px; font-family: 'DM Sans', sans-serif; background: transparent; min-width: 0">
      </div>
    </div>
  </form>

  <div style="margin-top: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 8px">
    <a href="Closet.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #0369A1; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">Save and add my first item</a>
  </div>
</div>
</x-dc>
