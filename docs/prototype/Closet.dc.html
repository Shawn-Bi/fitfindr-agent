</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F8FC; color: #1B1E1C; font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden">

    <header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 20px 16px 10px">
      <div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; letter-spacing: -0.5px">My Closet</h1>
        <div style="font-size: 13px; color: #4F5551">10 items · only you can see this</div>
      </div>
      <a href="AddItem.dc.html" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #0369A1; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px">

      <button type="button" role="tab" aria-selected="false" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 14px">Tops 3</button>
      <button type="button" role="tab" aria-selected="false" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 14px">Bottoms 2</button>
      <button type="button" role="tab" aria-selected="false" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 14px">Outerwear 2</button>

      <button type="button" role="tab" aria-selected="false" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9CDC6; background: #FFFFFF; color: #1B1E1C; font-family: 'DM Sans', sans-serif; font-size: 14px">Accessories 1</button>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 0">
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">
        <span role="img" aria-label="Photo of baggy dark-wash jeans" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #34507A"></span>
        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Baggy straight-leg jeans</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">

        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">White ribbed tank</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">
        <span role="img" aria-label="Photo of black cropped zip hoodie" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #2B2E2C"></span>
        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Cropped zip hoodie</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">

        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Black denim jacket</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">
        <span role="img" aria-label="Photo of wide-leg khaki trousers" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #C9B48C"></span>
        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Wide-leg khakis</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">
        <span role="img" aria-label="Photo of oversized grey crewneck" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #9DA29E"></span>
        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Grey crewneck</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">
        <span role="img" aria-label="Photo of chunky white sneakers" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #ECEDEA"></span>
        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Chunky white sneakers</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">
        <span role="img" aria-label="Photo of black combat boots" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #1B1E1C"></span>
        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Combat boots</span></a>
      <a href="ItemDetail.dc.html" style="text-decoration: none; color: #1B1E1C; display: flex; flex-direction: column; gap: 5px">
        <span role="img" aria-label="Photo of brown leather belt" style="aspect-ratio: 3 / 4; border-radius: 12px; background: #7A4E2D"></span>
        <span style="font-size: 12px; line-height: 1.25; font-weight: 500">Brown leather belt</span></a>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #FFFFFF; border-top: 1px solid #DADDD7; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #4F5551; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"></path></svg>Home</a>
    <a href="Closet.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0369A1; font-size: 12px; font-weight: 700">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
